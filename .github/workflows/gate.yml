name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bunx tsgo --noEmit -p tsconfig.json
      - run: bun run test
      - run: bun run bundle
      - name: 100-thread benchmark
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: XIN_LOAD=1 bun run test
