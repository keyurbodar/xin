<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0c" />
    <title>Ingle</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      const scheme = localStorage.getItem("ingle.theme.scheme") ?? localStorage.getItem("ingle.theme")
      document.documentElement.dataset.theme = ["light", "rose"].includes(scheme) ? scheme : "dark"
      if (localStorage.getItem("ingle.motion") === "reduce") document.documentElement.dataset.motion = "reduce"
      addEventListener(
        "error",
        (event) => {
          const el = event.target
          const chunk = el instanceof HTMLScriptElement || (el instanceof HTMLLinkElement && el.rel === "modulepreload")
          if (!chunk || window.ingleBooted) return
          if (sessionStorage.getItem("ingle.boot.retry") === null) {
            sessionStorage.setItem("ingle.boot.retry", "1")
            const url = new URL(location.href)
            url.searchParams.set("boot", String(Date.now()))
            location.replace(url)
            return
          }
          if (document.getElementById("boot-failed") !== null) return
          const box = document.createElement("div")
          box.id = "boot-failed"
          box.setAttribute("role", "alert")
          box.style.cssText =
            "position:fixed;inset:0;display:grid;place-content:center;gap:12px;justify-items:center;padding:24px;text-align:center;font:14px/1.5 system-ui,sans-serif;background:Canvas;color:CanvasText;color-scheme:" +
            (document.documentElement.dataset.theme === "dark" ? "dark" : "light")
          const text = document.createElement("p")
          text.style.margin = "0"
          text.textContent = "Ingle didn't load. Check your connection and reload."
          const button = document.createElement("button")
          button.type = "button"
          button.textContent = "Reload"
          button.style.cssText =
            "font:inherit;padding:6px 14px;border-radius:6px;border:1px solid GrayText;background:ButtonFace;color:ButtonText;cursor:pointer"
          button.onclick = () => {
            sessionStorage.removeItem("ingle.boot.retry")
            location.reload()
          }
          box.append(text, button)
          document.body.append(box)
          button.focus()
        },
        true,
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
